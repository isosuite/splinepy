name: Builds minimal and runs tests

on:
  push

permissions:
  contents: read

jobs:
  build_and_tests:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up  ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: build
      if: matrix.os != 'windows-latest'
      run: |
        pip install ".[test]" -v --config-settings=cmake.build-type="Debug"

    - name: build for windows
      if: matrix.os == 'windows-latest'
      run: |
        pip install ".[test]" -v

    # Every other job has scipy from the test extra; this one covers the
    # numpy-only fallbacks.
    - name: remove scipy
      if: matrix.os == 'ubuntu-latest'
      run: |
        pip uninstall -y scipy

    # The viewer's screenshot and widget tests skip without these; this job
    # runs them in headless Chromium.
    - name: install headless browser
      if: matrix.os == 'ubuntu-latest'
      run: |
        pip install playwright pillow anywidget
        playwright install --with-deps chromium

    - name: test
      run: |
        pytest tests -rs
