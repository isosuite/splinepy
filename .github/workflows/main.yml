name: main

on:
  push:
    branches: ["main", "fix-build"]

jobs:
  build_wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - os: macos-15-intel
            arch: x86_64
            build: ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
            platform: macos
          # macOS ARM (M1/M2)
          - os: macos-latest
            arch: arm64
            build: ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
            platform: macos
          # Linux
          - os: ubuntu-latest
            arch: x86_64
            build: ["cp310*many*", "cp311*many*", "cp312*many*", "cp313*many*", "cp314*many*"]
            platform: linux
            skip: "cp314t-*"
          # Windows
          - os: windows-latest
            arch: AMD64
            build: ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
            platform: windows
            test_skip: "*-win_arm64"

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.0
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ join(matrix.build, ',') }}
        CIBW_SKIP: ${{ matrix.skip || '' }}
        CIBW_TEST_SKIP: ${{ matrix.test_skip || '' }}
        SPLINEPY_GITHUB_ACTIONS_BUILD: True
        SKBUILD_INSTALL_COMPONENTS: PythonModule

    - uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.platform }}-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl
        retention-days: 7

  build_sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build source distribution
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: wheels-source
        path: ./dist/*
        retention-days: 7

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        if: github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
