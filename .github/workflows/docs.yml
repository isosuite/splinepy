name: docs

on: [push, pull_request]

permissions:
  contents: read

jobs:
  minimal_explicit_build_and_docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz doxygen

    - name: doxygen
      run: |
        cd docs
        mkdir build
        doxygen Doxyfile

    - name: Set up  python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: build splinepy linux
      run: pip install ".[gustaf]" -v

    - name: sphinx
      run: |
        pip install -r ./docs/requirements.txt
        python docs/source/handle_markdown.py
        python docs/markdown/extra_docs.py
        sphinx-build -b html docs/source docs/build

    - name: Upload built docs
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: html-docs
        path: docs/build
        if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: minimal_explicit_build_and_docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: html-docs
        path: docs/build

    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        force_orphan: true
