name: Standalone C++ core tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  cpp_core_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure C++ tests
        run: >
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release
          -DSPLINEPY_COMPILE_PYTHON=OFF -DSPLINEPY_CORE_BUILD_TESTS=ON

      - name: Build C++ tests
        run: cmake --build build-core --parallel

      - name: Run C++ tests
        run: ctest --test-dir build-core --output-on-failure --no-tests=error
