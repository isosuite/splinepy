name: Standalone C++ core tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  cpp_core_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate fixtures with the release oracle
        run: |
          python -m pip install "numpy==2.2.6" "splinepy==0.2.1"
          python -I tests/generate_golden_data.py

      - name: Configure C++ tests
        run: |
          if [ -f core/CMakeLists.txt ]; then
            cmake -S core -B build-core -DCMAKE_BUILD_TYPE=Release -DSPLINEPY_CORE_BUILD_TESTS=ON -DSPLINEPY_CORE_BUILD_BENCHMARKS=OFF
          else
            cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DSPLINEPY_COMPILE_PYTHON=OFF -DSPLINEPY_CORE_BUILD_TESTS=ON
          fi

      - name: Build C++ tests
        run: cmake --build build-core --parallel

      - name: Run C++ tests
        run: ctest --test-dir build-core --output-on-failure --no-tests=error
